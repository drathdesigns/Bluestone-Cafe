<style>
  :root{
    --navy:#1F3350;
    --navy-deep:#16283F;
    --tan:#C08A52;
    --tan-dark:#9C7040;
    --tan-soft:#F1E1C6;
    --cream-bg:#FAF5EC;
    --cream-card:#FFFFFF;
    --rust:#C1543A;
    --ink:#2A2018;
    --line:#EBDFC9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--cream-bg);
    font-family:'Karla',sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    background:
      radial-gradient(circle at 12% 0%, rgba(192,138,82,0.10), transparent 45%),
      radial-gradient(circle at 92% 8%, rgba(31,51,80,0.06), transparent 42%),
      var(--cream-bg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 18px 60px;
  }

  /* ---------- Header ---------- */
  header{
    width:100%;
    max-width:980px;
    display:flex;
    align-items:center;
    gap:24px;
    margin-bottom:6px;
  }
  header img{
    width:150px;
    height:150px;
    object-fit:contain;
    filter:drop-shadow(0 10px 20px rgba(31,51,80,0.18));
    flex-shrink:0;
  }
  header .title-block{flex:1;}
  header h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:700;
    color:var(--navy);
    font-size:clamp(36px,6.5vw,56px);
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    color:var(--tan-dark);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    font-weight:600;
  }
  #clock{
    font-family:'IBM Plex Mono',monospace;
    color:var(--navy);
    font-size:13px;
    text-align:right;
    line-height:1.5;
    opacity:0.75;
    flex-shrink:0;
  }
  #clock .day{color:var(--tan-dark);}

  .rail-line{
    width:100%;
    max-width:980px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--tan) 15%, var(--tan) 85%, transparent);
    margin:22px 0 32px;
    opacity:0.4;
  }

  /* ---------- Ticket Grid ---------- */
  .grid{
    width:100%;
    max-width:980px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:22px;
  }

  .ticket{
    position:relative;
    background:var(--cream-card);
    border-radius:20px;
    padding:24px 22px 22px;
    box-shadow:0 6px 20px rgba(31,51,80,0.08), 0 1px 0 rgba(31,51,80,0.04);
    cursor:pointer;
    border:1px solid var(--line);
    text-align:left;
    font:inherit;
    color:inherit;
    -webkit-appearance:none;
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;
    flex-direction:column;
    min-height:168px;
    overflow:hidden;
  }
  .ticket:active{
    transform:scale(0.97);
    box-shadow:0 3px 10px rgba(31,51,80,0.10);
  }
  /* background icon watermark, communicates category at a glance */
  .ticket .bg-icon{
    position:absolute;
    right:-14px; bottom:-14px;
    width:118px; height:118px;
    opacity:0.10;
    pointer-events:none;
    color:var(--accent, var(--tan));
  }
  .ticket .bg-icon svg{
    width:100%; height:100%;
    fill:none;
    stroke:currentColor;
    stroke-width:5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .ticket::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:var(--accent, var(--tan));
    border-radius:20px 0 0 20px;
  }
  .ticket h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19.5px;
    margin:0 0 7px;
    color:var(--navy);
    position:relative;
  }
  .ticket p{
    margin:0;
    font-size:13.5px;
    color:#6b5c46;
    line-height:1.5;
    flex:1;
    position:relative;
  }
  .ticket .go{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--accent, var(--rust));
    display:flex;
    align-items:center;
    gap:6px;
    position:relative;
    font-weight:700;
  }

  .ticket--announce{
    --accent:#C08A52;
    background:#1B2A42;
    border-color:#1B2A42;
  }
  .ticket--announce h2{ color:#FAF5EC; }
  .ticket--announce p{ color:#D9CBB8; }
  .ticket--announce .bg-icon{ opacity:0.18; color:#C08A52; }
  .ticket--schedule{ --accent:#1F3350; }
  .ticket--duties{ --accent:#9C7040; }
  .ticket--stock{ --accent:#B5651D; }
  .ticket--idea{ --accent:#B8901E; }
  .ticket--contact{ --accent:#3E6E77; }

  .badge-dot{
    position:absolute;
    top:16px; right:18px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--rust);
    box-shadow:0 0 0 4px rgba(193,84,58,0.15);
    display:none;
  }
  .ticket.has-alert .badge-dot{display:block;}

  footer{
    margin-top:36px;
    text-align:center;
    color:var(--tan-dark);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    opacity:0.55;
  }

  /* ---------- Modal / Slide-up panel ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(19,31,51,0.75);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:50;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .panel{
    width:100%;
    max-width:980px;
    height:88vh;
    background:var(--cream-bright);
    border-radius:16px 16px 0 0;
    display:flex;
    flex-direction:column;
    transform:translateY(30px);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;
  }
  .overlay.open .panel{transform:translateY(0);}
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    background:var(--navy);
    color:var(--cream-bright);
    flex-shrink:0;
  }
  .panel-head h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin:0;
  }
  .panel-head button{
    background:var(--tan);
    color:var(--navy-deep);
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.5px;
    font-weight:600;
    cursor:pointer;
  }
  .panel-body{flex:1; overflow:auto; background:#fff;}
  .panel-body iframe{width:100%; height:100%; border:none;}
  .panel-body .text-fallback{
    padding:24px;
    font-family:'Karla',sans-serif;
    color:var(--ink);
    line-height:1.6;
  }
  .panel-body .text-fallback a{color:var(--rust); font-weight:700;}
  .announce-list{list-style:none; margin:0; padding:0;}
  .announce-list li{
    padding:16px 22px;
    border-bottom:1px dashed #d9c9a3;
    font-family:'Karla',sans-serif;
  }
  .announce-list .date{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--tan-dark);
    letter-spacing:0.5px;
    margin-bottom:4px;
    text-transform:uppercase;
  }
  .announce-list .msg{font-size:15px; color:var(--ink);}

  @media (max-width:600px){
    header{flex-wrap:wrap;}
    #clock{display:none;}
    .panel{height:92vh; border-radius:14px 14px 0 0;}
  }
</style>
</head>

<script>
/* =========================================================
   EDIT THIS CONFIG SECTION TO SET UP YOUR LINKS
   ========================================================= */
const CONFIG = {
  // Google Sheet schedule — use File > Share > Publish to web, or a "view only" link.
  // Tip: append "?rm=minimal" or use a Google Sheets "publish to web" embed URL for best results.
  scheduleUrl: "https://docs.google.com/spreadsheets/d/193ROVOztytHWXFk9mR11Hfeimx8P0ISsgnsGqufwdyM/htmlview",

  // Your checklist & policy PDFs — upload each to Google Drive, set sharing to "Anyone with the link",
  // then use the /preview link format: https://drive.google.com/file/d/FILE_ID/preview
  openingDutiesUrl: "https://drive.google.com/file/d/16fA3QO6hFZkKRMMBa4dn4uua2EIbwsvT/preview",
  rolesDutiesUrl: "https://drive.google.com/file/d/1vb_hYSF5Sq28tbot0FY70qT2Afrl0MWJ/preview",
  closingDutiesUrl: "https://drive.google.com/file/d/1XtUy_bzNm70sMR3YzC0NicW4uo6Z27cv/preview",
  policiesUrl: "https://drive.google.com/file/d/1zWGe4w50NKkROkJsAoYzWS5oCEV8JGQW/preview",

  // Google Form where students sign off that they've read the Cafe Policies.
  // Create this form with a Name field + a checkbox "I have read and agree...",
  // and set its response destination to a new tab in your schedule/roster Google Sheet.
  policiesAckFormUrl: "https://docs.google.com/forms/d/e/1FAIpQLScvZjrU3fQyEdAXwI34P0hIZbSroVnVCdJ1d2X5uH8A-Z5Lsg/viewform",

  // Google Form links for low stock reports and idea submissions
  lowStockFormUrl: "https://docs.google.com/forms/d/e/1FAIpQLSfqUuXaqON-qaoMbh3T3bpcl6rHamzydgE_RvINlBRXdT1xng/viewform?embedded=true",
  ideaFormUrl: "https://docs.google.com/forms/d/e/1FAIpQLSdqkGqHghvv-vwBBpCAPra3vifxO2pRbW7BOYdCVyy_iF4sVA/viewform?embedded=true",

  // How students reach you. Use "mailto:you@school.org" or "sms:+15551234567"
  contactUrl: "mailto:drathmell@windsor-csd.org",
  contactLabel: "drathmell@windsor-csd.org",

  // Announcements — newest first. Edit freely, add/remove lines any time.
  announcements: [
    { date: "Mon, Aug 24", msg: "Welcome back! New pastry case labels go up this week — check with Mr. Rathmell before rearranging anything." },
    { date: "Fri, Aug 21", msg: "Reminder: rinse the milk frother wand after every use, even between drinks." },
    { date: "Wed, Aug 19", msg: "New tip jar design is live — thanks to whoever suggested the mason jar look!" }
  ],

  // Roster and announcements are both pulled live from tabs in your schedule sheet.
  scheduleSheetId: "193ROVOztytHWXFk9mR11Hfeimx8P0ISsgnsGqufwdyM",
  rosterTabName: "Roster",
  announcementsTabName: "Announcements",

  // Paste the /exec URL from your Apps Script deployment here to enable read-receipt logging.
  readReceiptWebAppUrl: "https://script.google.com/macros/s/AKfycbzqocjg9s2ndBc_2J0nymj9XHxqxPjYmPKN6Gnq3rVxIHDaMoudDW8leLGmL3N_q6Ne/exec"
};
/* ========================================================= */

const titles = {
  announcements: "Announcements",
  schedule: "Cafe Schedule",
  duties: "Shift Checklist",
  lowstock: "Report Low Stock",
  idea: "Share an Idea",
  contact: "Message the Boss"
};

const overlay = document.getElementById('overlay');
const panelTitle = document.getElementById('panel-title');
const panelBody = document.getElementById('panel-body');

function isPlaceholder(url){
  return !url || url.indexOf("PASTE_YOUR") === 0;
}

function openPanel(key){
  panelTitle.textContent = titles[key] || "Bluestone Hub";
  panelBody.innerHTML = "";

  if(key === "announcements"){
    renderAnnouncements();
    panelBody.style.background = "#fff";
  }
  else if(key === "contact"){
    const div = document.createElement('div');
    div.className = 'text-fallback';
    div.innerHTML = "Need to reach Mr. Rathmell during a shift?<br><br><a href='"+CONFIG.contactUrl+"' style='font-size:20px;'>"+CONFIG.contactLabel+"</a>";
    panelBody.appendChild(div);
  }
  else if(key === "duties"){
    renderDutiesMenu();
  }
  else {
    const urlMap = { schedule: CONFIG.scheduleUrl, lowstock: CONFIG.lowStockFormUrl, idea: CONFIG.ideaFormUrl };
    const configKeyMap = { schedule: "scheduleUrl", lowstock: "lowStockFormUrl", idea: "ideaFormUrl" };
    const url = urlMap[key];
    if(isPlaceholder(url)){
      const div = document.createElement('div');
      div.className = 'text-fallback';
      div.innerHTML = "This section isn't set up yet.<br><br>Open the hub's HTML file and paste a link into <b>CONFIG."+
        configKeyMap[key]+
        "</b> near the top of the &lt;script&gt; section.";
      panelBody.appendChild(div);
    } else {
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.setAttribute('loading','lazy');
      panelBody.appendChild(iframe);
    }
  }

  overlay.classList.add('open');
}

document.querySelectorAll('.ticket').forEach(t=>{
  t.addEventListener('click', ()=> openPanel(t.dataset.panel));
});
document.getElementById('panel-close').addEventListener('click', ()=>{
  overlay.classList.remove('open');
});
overlay.addEventListener('click', (e)=>{
  if(e.target === overlay) overlay.classList.remove('open');
});

let rosterNamesCache = null;

function isPlaceholderVal(url){
  return !url || url.indexOf("PASTE_YOUR") === 0;
}

let announcementsCache = null;

async function fetchAnnouncements(){
  if(announcementsCache) return announcementsCache;
  try{
    const url = "https://docs.google.com/spreadsheets/d/"+CONFIG.scheduleSheetId+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(CONFIG.announcementsTabName);
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}')+1));
    const rows = json.table.rows || [];
    const items = rows
      .map(r => {
        const date = r.c && r.c[0] && r.c[0].v ? String(r.c[0].v).trim() : "";
        const msg = r.c && r.c[1] && r.c[1].v ? String(r.c[1].v).trim() : "";
        return (date || msg) ? { date, msg } : null;
      })
      .filter(Boolean)
      .reverse(); // newest row (bottom of sheet) shown first
    announcementsCache = items;
    return items;
  } catch(err){
    return null; // signals "fetch failed" so we can fall back
  }
}

async function fetchRosterNames(){
  if(rosterNamesCache) return rosterNamesCache;
  try{
    const url = "https://docs.google.com/spreadsheets/d/"+CONFIG.scheduleSheetId+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(CONFIG.rosterTabName);
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}')+1));
    const rows = json.table.rows || [];
    const names = rows
      .map(r => r.c && r.c[0] && r.c[0].v ? String(r.c[0].v).trim() : null)
      .filter(n => n && n.toLowerCase() !== "student names");
    rosterNamesCache = [...new Set(names)];
    return rosterNamesCache;
  } catch(err){
    return [];
  }
}

function logReadReceipt(name, announcementMsg, btn){
  if(isPlaceholderVal(CONFIG.readReceiptWebAppUrl)){
    btn.textContent = "✓ Marked (logging not set up yet)";
    btn.disabled = true;
    return;
  }
  const url = CONFIG.readReceiptWebAppUrl
    + "?name=" + encodeURIComponent(name)
    + "&announcement=" + encodeURIComponent(announcementMsg);
  fetch(url, { mode: "no-cors" }).catch(()=>{});
  btn.textContent = "✓ Thanks, " + name + "!";
  btn.disabled = true;
  btn.style.opacity = "0.7";
}

async function renderAnnouncements(){
  panelBody.innerHTML = "";

  const nameBar = document.createElement('div');
  nameBar.style.cssText = "padding:14px 22px;background:#F1E6C8;border-bottom:2px solid #A97C50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;";
  nameBar.innerHTML = "<label style='font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:0.5px;color:#5c4d38;'>WHO'S READING?</label>";

  const select = document.createElement('select');
  select.id = "reader-name-select";
  select.style.cssText = "flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1px solid #A97C50;font-family:'Karla',sans-serif;font-size:14px;background:#fff;";
  select.innerHTML = "<option value=''>Loading names…</option>";
  nameBar.appendChild(select);
  panelBody.appendChild(nameBar);

  const ul = document.createElement('ul');
  ul.className = 'announce-list';
  ul.innerHTML = "<li style='padding:20px 22px;color:#8a7a5c;'>Loading announcements…</li>";
  panelBody.appendChild(ul);

  let items = await fetchAnnouncements();
  if(items === null){
    // fetch failed entirely — fall back to the built-in list in CONFIG
    items = CONFIG.announcements;
  }

  ul.innerHTML = "";
  if(!items.length){
    ul.innerHTML = "<li style='padding:20px 22px;color:#8a7a5c;'>No announcements yet.</li>";
  }
  items.forEach((a)=>{
    const li = document.createElement('li');
    li.innerHTML = '<span class="date">'+a.date+'</span><span class="msg">'+a.msg+'</span>';

    const btn = document.createElement('button');
    btn.textContent = "✓ I've read this";
    btn.style.cssText = "margin-top:10px;padding:9px 14px;border:none;border-radius:8px;background:#B8543A;color:#F8F1DE;font-family:'Karla',sans-serif;font-weight:700;font-size:13px;cursor:pointer;display:block;";
    btn.addEventListener('click', ()=>{
      const nameField = document.getElementById('reader-name-select');
      const name = nameField ? nameField.value.trim() : "";
      if(!name){
        alert("Please select (or type) your name first.");
        return;
      }
      logReadReceipt(name, a.msg, btn);
    });
    li.appendChild(btn);
    ul.appendChild(li);
  });

  const names = await fetchRosterNames();
  if(names.length){
    select.innerHTML = "<option value=''>Select your name…</option>" + names.map(n => "<option value='"+n.replace(/'/g,"&#39;")+"'>"+n+"</option>").join("");
  } else {
    select.innerHTML = "<option value=''>Couldn't load roster — type below</option>";
    select.style.display = "none";
    const fallbackInput = document.createElement('input');
    fallbackInput.type = "text";
    fallbackInput.placeholder = "Type your name";
    fallbackInput.id = "reader-name-select";
    fallbackInput.style.cssText = select.style.cssText;
    select.replaceWith(fallbackInput);
  }
}

function renderDutiesMenu(){
  panelBody.style.background = "#fff";
  const wrap = document.createElement('div');
  wrap.style.padding = "22px";
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.gap = "14px";

  const items = [
    { key: "openingDutiesUrl", label: "Opening Checklist", icon: "🌅" },
    { key: "rolesDutiesUrl", label: "Roles & Responsibilities", icon: "🧾" },
    { key: "closingDutiesUrl", label: "Closing Checklist", icon: "🌙" },
    { key: "policiesUrl", label: "Cafe Policies", icon: "📋", isPolicies: true }
  ];

  items.forEach(item=>{
    const btn = document.createElement('button');
    btn.style.cssText = "display:flex;align-items:center;gap:12px;padding:16px 18px;border:none;border-radius:10px;background:#F1E6C8;font-family:'Karla',sans-serif;font-size:15px;font-weight:700;color:#241A0F;cursor:pointer;text-align:left;";
    btn.innerHTML = "<span style='font-size:20px;'>"+item.icon+"</span><span>"+item.label+"</span>";
    if(item.isPolicies){
      btn.addEventListener('click', ()=> renderPoliciesPdf(item.label, CONFIG[item.key]));
    } else {
      btn.addEventListener('click', ()=> renderDutiesPdf(item.label, CONFIG[item.key]));
    }
    wrap.appendChild(btn);
  });

  panelBody.appendChild(wrap);
}

function renderDutiesPdf(label, url){
  panelBody.innerHTML = "";
  if(isPlaceholder(url)){
    const div = document.createElement('div');
    div.className = 'text-fallback';
    div.innerHTML = "The <b>"+label+"</b> link isn't set up yet.<br><br>Open the hub's HTML file and paste a link into the matching CONFIG field near the top of the &lt;script&gt; section.";
    panelBody.appendChild(div);
    return;
  }
  const backBtn = document.createElement('button');
  backBtn.textContent = "← Back to checklists";
  backBtn.style.cssText = "margin:14px 18px 0;padding:8px 14px;border:none;border-radius:8px;background:#A97C50;color:#131F33;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.5px;cursor:pointer;";
  backBtn.addEventListener('click', renderDutiesMenu);
  panelBody.appendChild(backBtn);

  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.setAttribute('loading','lazy');
  iframe.style.height = "calc(100% - 50px)";
  panelBody.appendChild(iframe);
}

function renderPoliciesPdf(label, url){
  panelBody.innerHTML = "";

  const backBtn = document.createElement('button');
  backBtn.textContent = "← Back to checklists";
  backBtn.style.cssText = "margin:14px 18px 0;padding:8px 14px;border:none;border-radius:8px;background:#A97C50;color:#131F33;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.5px;cursor:pointer;";
  backBtn.addEventListener('click', renderDutiesMenu);
  panelBody.appendChild(backBtn);

  if(isPlaceholder(url)){
    const div = document.createElement('div');
    div.className = 'text-fallback';
    div.innerHTML = "The <b>Cafe Policies</b> link isn't set up yet.<br><br>Open the hub's HTML file and paste a link into <b>CONFIG.policiesUrl</b> near the top of the &lt;script&gt; section.";
    panelBody.appendChild(div);
    return;
  }

  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.setAttribute('loading','lazy');
  iframe.style.height = "calc(100% - 110px)";
  panelBody.appendChild(iframe);

  const ackWrap = document.createElement('div');
  ackWrap.style.cssText = "padding:14px 18px;background:#F1E6C8;border-top:2px solid #A97C50;";
  const ackBtn = document.createElement('a');
  ackBtn.textContent = "✍️ Sign & Acknowledge These Policies";
  ackBtn.href = isPlaceholder(CONFIG.policiesAckFormUrl) ? "#" : CONFIG.policiesAckFormUrl;
  ackBtn.target = "_blank";
  ackBtn.style.cssText = "display:block;text-align:center;padding:14px;border-radius:10px;background:#B8543A;color:#F8F1DE;font-family:'Karla',sans-serif;font-weight:700;font-size:15px;text-decoration:none;";
  if(isPlaceholder(CONFIG.policiesAckFormUrl)){
    ackBtn.addEventListener('click', (e)=>{
      e.preventDefault();
      alert("Acknowledgment form isn't set up yet. Paste a link into CONFIG.policiesAckFormUrl.");
    });
  }
  ackWrap.appendChild(ackBtn);
  panelBody.appendChild(ackWrap);
}

/* Clock */
function tick(){
  const now = new Date();
  const day = now.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
  const time = now.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
  document.querySelector('#clock .day').textContent = day;
  document.querySelector('#clock .time').textContent = time;
}
tick();
setInterval(tick, 15000);
